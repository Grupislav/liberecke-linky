# Automatická aktualizace mapových dat z GTFS.
# Denně stáhne feed DPMLJ, přegeneruje mapa-assets/data/*.json a když se data
# změní (nový feed), commitne je a nasadí na produkci přes FTP.
# (Push robotem sám nespustí deploy-ftp.yml, proto deployuje tenhle workflow.)
#
# Secrets (stejné jako deploy-ftp.yml): FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR

name: Update map data

on:
  schedule:
    - cron: '0 4 * * *'   # denně 04:00 UTC
  workflow_dispatch: {}    # lze spustit i ručně

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Stáhni a rozbal GTFS
        env:
          # URL proxy na produkčním (českém) serveru – GitHub runner na DPMLJ
          # přímo nedosáhne (blokace IP). Např. https://…/liberecke-linky/gtfs-proxy.php?key=TOKEN
          PROXY: ${{ secrets.GTFS_PROXY_URL }}
        run: |
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"
          URL="$PROXY"
          if [ -z "$URL" ]; then
            echo "::warning::GTFS_PROXY_URL není nastaveno – zkouším přímo DPMLJ (z GitHubu obvykle selže)."
            URL="http://www.dpmlj.cz/gtfs.zip"
          fi
          ok=
          for i in 1 2 3 4 5; do
            if curl -4 --http1.1 -A "$UA" -sSL --fail \
                    --connect-timeout 30 --max-time 600 -o gtfs.zip "$URL"; then ok=1; break; fi
            echo "::warning::stažení GTFS – pokus $i selhal, čekám 20 s"; sleep 20
          done
          if [ -z "$ok" ]; then
            echo "::error::Stažení GTFS selhalo (URL: ${URL%%\?*})."
            exit 1
          fi
          ls -l gtfs.zip
          # ověř, že to je ZIP a ne chybová odpověď proxy (PK = magic ZIP)
          if [ "$(head -c2 gtfs.zip)" != "PK" ]; then
            echo "::error::Stažený soubor není ZIP – obsah odpovědi (proxy):"
            head -c 2000 gtfs.zip; echo
            exit 1
          fi
          unzip -o -q gtfs.zip -d gtfs

      - name: Přegeneruj data
        run: python tools/build_data.py

      - name: Kontrola rozumnosti dat
        run: |
          python -c "import json,sys; c=json.load(open('mapa-assets/data/meta.json'))['counts']; (sys.exit('Podezřele málo dat: %s – přerušuji.' % c) if (c['routes']<20 or c['stops']<100 or c.get('trips',0)<500) else print('OK:', c))"

      - name: Změnila se data?
        id: diff
        run: |
          if [ -n "$(git status --porcelain mapa-assets/data)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Feed beze změny – nic nedělám."
          fi

      - name: Commit a push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VALID=$(python -c "import json;print(json.load(open('mapa-assets/data/meta.json'))['valid_to'])")
          git add mapa-assets/data
          git commit -m "Update map data from GTFS (valid to ${VALID})"
          git push

      - name: Deploy přes FTP
        if: steps.diff.outputs.changed == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            config.example.php
            CLAUDE.md
            tools/**
